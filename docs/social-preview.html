<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Bricolage Grotesque';font-weight:200 800;font-stretch:75% 100%;src:url('../fonts/bricolage-grotesque/BricolageGrotesque%5Bopsz,wdth,wght%5D.woff2') format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:400 700;font-stretch:75% 100%;src:url('../fonts/instrument-sans/InstrumentSans%5Bwdth,wght%5D.woff2') format('woff2')}
html,body{margin:0;width:1280px;height:640px;background:radial-gradient(900px 520px at 50% 42%,#0C2A31 0%,#08161B 40%,#07080B 100%)}
.card{position:absolute;inset:80px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:34px}
.lockup{display:flex;align-items:center;gap:40px}
.tag{font:700 52px/1.1 'Bricolage Grotesque',sans-serif;color:#EDF0EE;text-align:center}
.sub{font:500 22px/1.3 'Instrument Sans',sans-serif;color:#A7B1B3;letter-spacing:.01em;text-align:center}
.rule{display:flex;gap:6px}.rule i{display:block;height:4px;border-radius:2px}
</style></head><body><div class="card">
<div class="lockup"><img src="../marks/sournd-icon-full.svg" width="150" height="150"><img src="../marks/sournd-wordmark-dark.svg" height="104"></div>
<div class="tag">Everything you need to make any effect</div>
<div class="rule"><i style="width:56px;background:#6BBCC6"></i><i style="width:28px;background:#F4A340"></i><i style="width:16px;background:#E0577F"></i><i style="width:8px;background:#B388FF"></i></div>
<div class="sub">Effects on audio you supply and instruments you play. Never generated music.</div>
</div></body></html>
