[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sournd-assets"
version = "0.1.0"
description = "sournd brand kit: wordmark, icon, favicons, colour and interface tokens, and fonts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary (marks); SIL OFL 1.1 (fonts)" }

[tool.hatch.build.targets.wheel]
packages = ["python/sournd_assets"]

[tool.hatch.build.targets.wheel.force-include]
"tokens" = "sournd_assets/tokens"
"marks" = "sournd_assets/marks"
"web" = "sournd_assets/web"
"fonts/fonts.css" = "sournd_assets/fonts/fonts.css"
"fonts/bricolage-grotesque" = "sournd_assets/fonts/bricolage-grotesque"
"fonts/instrument-sans" = "sournd_assets/fonts/instrument-sans"
